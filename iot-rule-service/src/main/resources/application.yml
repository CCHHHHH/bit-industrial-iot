server:
  port: 9004
  servlet:
    context-path: /iot

spring:
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  application:
    name: iot-rule-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bit_iot?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: chenhao1998@
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid

# 算法文件上传路径
rule:
  algorithm:
    upload-path: ./algorithms
    # 算法共享存储路径（Flink 集群各 TaskManager 可访问）
    shared-path: /mnt/shared/algorithms
    max-file-size-bytes: 52428800
  # 规则引擎模式：flink（提交到 Flink 集群） / local（本地线程池，开发调试用）
  engine:
    type: flink

# Flink 集群配置
flink:
  rest:
    url: http://localhost:8081
  job:
    jar-path: ./iot-flink-job/target/iot-flink-job-0.0.1-SNAPSHOT.jar

# TDEngine 连接（传递给 Flink Job）
tdengine:
  jdbc-url: jdbc:TAOS-RS://localhost:6041/bit_iot_ts
  username: root
  password: taosdata
  super-table: device_data
  result-stable: rule_result_stable
  enabled: false

# MQTT 连接（realtime 模式传递给 Flink Job）
mqtt:
  broker-url: tcp://localhost:1883
  topic-pattern: devices/+/telemetry
  username:
  password:

data:
  service:
    base-url: http://127.0.0.1:9005/iot

# Knife4j API 文档
knife4j:
  enable: true
  setting:
    language: zh_cn
